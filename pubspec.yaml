name: devine_word
description: "Devine Word — A New Verse Everyday. A Quran reading and listening app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  shared_preferences: ^2.2.3
  http: ^0.13.6
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/01-splash/
    - assets/02-onboarding-read/
    - assets/03-onboarding-listen/
    - assets/04-onboarding-translation/
    - assets/05-home/
    - assets/06-saved-ayahs/
    - assets/07-recent-activity/
    - assets/08-settings/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-400.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-400.ttf
        - asset: assets/fonts/NotoNaskhArabic-700.ttf
          weight: 700
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-400.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-500.ttf
          weight: 500
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-400.ttf
