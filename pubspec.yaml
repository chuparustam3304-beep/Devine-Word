name: devine_word
description: "Devine Word — A New Verse Everyday. A Quran reading and listening app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  shared_preferences: ^2.2.3
  http: ^1.6.0
  just_audio: ^0.10.6
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/01-splash/
    - assets/09-onboarding/
    - assets/05-home/
    - assets/05-home/quran_reader/extracted/decorations/
    - assets/05-home/quran_reader/extracted/icons/
    - assets/05-home/quran_reader/extracted/ui/
    - assets/05-home/quran_reader/recreated/decorations/
    - assets/05-home/quran_reader/recreated/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-400.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-400.ttf
        - asset: assets/fonts/NotoNaskhArabic-700.ttf
          weight: 700
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-400.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-500.ttf
          weight: 500
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-400.ttf
